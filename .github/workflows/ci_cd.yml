name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: alarm_user
          POSTGRES_PASSWORD: alarm_password
          POSTGRES_DB: alarm_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


      mongo:
        image: mongo:7
        env: 
          MONGO_INITDB_ROOT_USERNAME: mongo_user
          MONGO_INITDB_ROOT_PASSWORD: mongo_password
        ports:
          - 27018:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://alarm_user:alarm_password@127.0.0.1:5433/alarm_db
      MONGO_URL: mongodb://mongo_user:mongo_password@localhost:27018
      ADMIN_EMAIL: techlead@gmail.com
      ADMIN_PASSWORD: TechLeadPassword
      ADMIN_NAME: Tech Lead
      

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r intelligent-alarm-backend/requirements.txt

      - name: Lint with flake8
        working-directory: intelligent-alarm-backend
        run: flake8 .

      - name: Check formatting with black
        working-directory: intelligent-alarm-backend
        run: black --check .

      - name: Run Alembic migrations against test Postgres
        working-directory: intelligent-alarm-backend
        run: alembic upgrade head

      - name: Run pytest
        working-directory: intelligent-alarm-backend
        run: pytest -v